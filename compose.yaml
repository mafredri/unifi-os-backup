services:
  unifi-os-backup:
    image: ghcr.io/mafredri/unifi-os-backup:latest
    restart: unless-stopped
    env_file: .env
    secrets:
      - home_username
      - home_password
    ports:
      - "8080:8080"
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "/usr/local/bin/unifi-os-backup", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  home_username:
    file: ./secrets/home_username
  home_password:
    file: ./secrets/home_password
