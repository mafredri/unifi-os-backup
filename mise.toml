# Tools and tasks for development and CI (jdx/mise-action). Renovate updates go
# in one group with go.mod's toolchain and the Dockerfile's golang image.
[tools]
go = "1.27.4"

[env]
# Fail instead of downloading another Go when go.mod asks for a newer one.
GOTOOLCHAIN = "local"

[tasks.check]
description = "Run every check the CI test job runs"
depends = ["fmt/check", "lint/go", "test/go"]

[tasks."fmt/check"]
description = "Check Go formatting"
run = 'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then printf "%s\n" "$unformatted"; exit 1; fi'

[tasks."lint/go"]
description = "Vet the Go code"
run = "go vet ./..."

[tasks."test/go"]
description = "Run the Go tests with and without the race detector"
run = ["go test ./...", "go test -race ./..."]

[tasks."build/image"]
description = "Build the image as unifi-os-backup:local"
run = "docker build -t unifi-os-backup:local ."

[tasks."test/image"]
description = "Build the image and check it with scripts/image-test.sh"
depends = ["build/image"]
run = "scripts/image-test.sh unifi-os-backup:local"
